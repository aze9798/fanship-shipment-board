<body>
  <header class="portal-top">
    <a class="brand" href="./">
      <span class="brand-mark">FS</span>
      <span><strong>帆顺科技</strong><small>统一入口</small></span>
    </a>
  </header>
  <main class="portal-main">
    <section id="loginView" class="login-card">
      <p class="eyebrow">帆顺科技</p>
      <h1>工作台登录</h1>
      <p class="lead">每位员工使用自己的访问码，系统按岗位自动开放对应功能。</p>

      <form id="loginForm" autocomplete="on">
        <div class="field access-field">
          <span id="accessCodeLabel">访问码</span>
          <div class="access-input-row">
            <input id="accessCode" class="access-code-input" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" data-lpignore="true" data-1p-ignore="true" aria-labelledby="accessCodeLabel" placeholder="请输入员工或管理员访问码" required>
            <button id="accessKeypadToggle" class="access-keypad-toggle" type="button">键盘打不开？</button>
          </div>
        </div>
        <section id="accessKeypad" class="access-keypad" aria-label="屏幕键盘" hidden>
          <div class="access-keypad-head"><strong>屏幕键盘</strong><span id="accessKeypadModeLabel">大写</span><button id="accessKeypadClose" type="button">收起</button></div>
          <div class="access-keypad-tools"><button type="button" data-keypad-mode="digits">123</button><button type="button" data-keypad-mode="upper">ABC</button><button type="button" data-keypad-mode="lower">abc</button></div>
          <div id="accessKeypadKeys" class="access-keypad-keys"></div>
          <div class="access-keypad-actions"><button id="accessKeypadBackspace" type="button">退格</button><button id="accessKeypadClear" type="button">清空</button></div>
        </section>
        <button id="loginButton" class="primary" type="submit">登录</button>
      </form>
      <p id="loginError" class="error" hidden></p>
      <p class="hint">第一次使用输入个人访问码；登录成功后会记住这台设备，下次直接进入。</p>
    </section>
    <section id="redirectView" class="redirect-card" hidden>
      <div class="spinner"></div>
      <h1>正在进入</h1>
      <p id="redirectHint">正在打开你的工作页面…</p>
    </section>
  </main>
  <footer class="portal-foot">帆顺科技 · 统一入口</footer>
  <script src="portal.js?v=9ecccd8180c2"></script>
